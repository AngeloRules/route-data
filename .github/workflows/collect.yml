name: Collect route travel times

on:
  schedule:
    # Watchdog, not the sampling schedule. Each job runs for about 5.7 hours and collects at every
    # slot itself (see scheduler.py). This hourly trigger keeps the next job queued behind the running
    # one, so a new job takes over as soon as the current one ends, even if GitHub skips some triggers.
    # A newer queued run replaces an older queued one, so cancelled runs in the Actions tab are expected.
    - cron: "13 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collect at every slot for the next few hours
        env:
          ROUTE_PROVIDER: mapbox
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          git config user.name "route-logger"
          git config user.email "route-logger@users.noreply.github.com"
          python scheduler.py
