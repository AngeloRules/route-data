name: Collect route travel times

on:
  schedule:
    # Lagos is UTC+1 all year (no daylight saving), so UTC hour = Lagos hour - 1.
    # Off-the-hour minutes avoid GitHub's busiest scheduling slots.
    # Weekday morning rush, every 10 minutes, 06:02 to 09:52 Lagos time: 24 runs.
    - cron: "2,12,22,32,42,52 5-8 * * 1-5"
    # Weekend mornings, every 20 minutes, 06:07 to 09:47 Lagos time: 12 runs.
    - cron: "7,27,47 5-8 * * 0,6"
    # Rest of the day, every 20 minutes, 05:07-05:47 and 10:07-21:47 Lagos time: 39 runs.
    - cron: "7,27,47 4,9-20 * * *"
    # Overnight, hourly, 22:07 to 04:07 Lagos time: 7 runs.
    - cron: "7 21-23,0-3 * * *"
    # Weekday 70 runs, weekend day 58 runs; 2 requests per run.
    # About 4,150 requests in a 31-day month, under Mapbox's 10,000-request trial cap.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query both routes
        env:
          ROUTE_PROVIDER: mapbox
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python collect.py
      - name: Save the new rows
        run: |
          git config user.name "route-logger"
          git config user.email "route-logger@users.noreply.github.com"
          git add data/observations.csv
          git commit -m "Log travel times $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
