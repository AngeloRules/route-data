name: Collect route travel times

on:
  schedule:
    # Lagos is UTC+1 all year (no daylight saving). Off-the-hour minutes avoid GitHub's busiest slots.
    # Every 20 minutes from 05:07 to 21:47 Lagos time (04:07-20:47 UTC): 51 runs.
    - cron: "7,27,47 4-20 * * *"
    # Hourly overnight, 22:07 to 04:07 Lagos time (21:07-03:07 UTC): 7 runs.
    - cron: "7 21-23,0-3 * * *"
    # 58 runs a day x 2 routes = about 3,600 requests in a 31-day month,
    # under Mapbox's 10,000 card-free trial Directions requests (and Google's 5,000 free).
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query both routes
        env:
          ROUTE_PROVIDER: mapbox
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python collect.py
      - name: Save the new rows
        run: |
          git config user.name "route-logger"
          git config user.email "route-logger@users.noreply.github.com"
          git add data/observations.csv
          git commit -m "Log travel times $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
